name: Refresh Pages for Endoscope Viewer

on:
  push:
    branches: [main]
    paths:
      - endoscopeviewer/endoscope-viewer.apk
      - endoscopeviewer/endoscope-viewer.apk.sha256
      - endoscopeviewer/version-code.txt
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # APK pushes use a repository deploy key. The branch-based Pages service
      # requires a separate build request for these pushes.
      - name: Request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
